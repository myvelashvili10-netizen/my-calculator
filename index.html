<!DOCTYPE html>

<html>
    <head>
        <title>My Calculator</title>
        <link rel="stylesheet" href="main.css">
    </head>
    <body>
        
        <main>
            <div class="calculator">
                <div class="screen">0</div>

                <div class="grid-container">
                    <div class="orange">AC</div>
                    <div class="orange">DEL</div>
                    <div class="orange">/</div>
                    <div class="orange">*</div>
                    <div>7</div>
                    <div>8</div>
                    <div>9</div>
                    <div class="orange">-</div>
                    <div>6</div>
                    <div>5</div>
                    <div>4</div>
                    <div class="orange">+</div>
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                    <div class="orange equal">=</div>
                    <div class="zero">0</div>
                    <div>.</div>
                </div>

                <div class="developer-info">Developed by Mariam</div>
            </div>
        </main>



        <footer></footer>
    </body>
</html>
